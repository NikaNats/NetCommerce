apiVersion: apps/v1
kind: Deployment
metadata:
  name: netcommerce-web
  namespace: netcommerce
  labels:
    app.kubernetes.io/part-of: netcommerce
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: netcommerce
        app.kubernetes.io/component: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Built by the release workflow with production build args baked in
          # (NEXT_PUBLIC_API_ORIGIN, PUBLIC_API_ORIGIN, STORAGE_ORIGIN).
          image: ghcr.io/REPLACE-OWNER/netcommerce-web:REPLACE-TAG
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: netcommerce-web
          env:
            - name: NODE_ENV
              value: production
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: netcommerce-web
  namespace: netcommerce
spec:
  selector:
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 3000
      targetPort: http
