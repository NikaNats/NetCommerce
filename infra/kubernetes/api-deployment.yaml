apiVersion: apps/v1
kind: Deployment
metadata:
  name: netcommerce-api
  namespace: netcommerce
  labels:
    app.kubernetes.io/part-of: netcommerce
    app.kubernetes.io/component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: netcommerce
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Pinned by the release workflow (kustomize edit set image). Never :latest.
          image: ghcr.io/REPLACE-OWNER/netcommerce-api:REPLACE-TAG
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: netcommerce-config
            - secretRef:
                name: netcommerce-api
          # Dependency-free liveness: restart only a broken process.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
          # Dependency-gated readiness: no traffic until config + store + API deps check out.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: '2'
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: netcommerce-api
  namespace: netcommerce
spec:
  selector:
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: netcommerce-api
  namespace: netcommerce
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: netcommerce-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
