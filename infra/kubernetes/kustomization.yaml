# Deploy order: namespace -> configmap -> secrets -> migrate job (to
# completion) -> api -> web. Set images per release, e.g.:
#   kustomize edit set image ghcr.io/OWNER/netcommerce-api:v1.2.3
#   kustomize edit set image ghcr.io/OWNER/netcommerce-web:v1.2.3
#   kubectl apply -k infra/kubernetes
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: netcommerce
resources:
  - namespace.yaml
  - configmap.yaml
  - api-deployment.yaml
  - web-deployment.yaml
  - migrate-job.yaml
  - ingress.yaml
images:
  - name: ghcr.io/REPLACE-OWNER/netcommerce-api
    newName: ghcr.io/REPLACE-OWNER/netcommerce-api
    newTag: REPLACE-TAG
  - name: ghcr.io/REPLACE-OWNER/netcommerce-web
    newName: ghcr.io/REPLACE-OWNER/netcommerce-web
    newTag: REPLACE-TAG
