# TEMPLATE ONLY. Copy to secrets.yaml (gitignored) and fill every value, or
# preferably create these via External Secrets Operator from the secret
# manager. NEVER commit real credentials. The API fails closed at startup when
# any required value is missing or a placeholder (see the *Validator classes),
# so an incomplete Secret refuses to boot rather than running degraded.
#
#   kubectl -n netcommerce create secret generic netcommerce-api --from-env-file=...
apiVersion: v1
kind: Secret
metadata:
  name: netcommerce-api
  namespace: netcommerce
type: Opaque
stringData:
  # Six bounded-context databases (managed Postgres recommended, PITR enabled).
  ConnectionStrings__CatalogDb: "Host=pg.example.com;Port=5432;Database=catalog;Username=REPLACE;Password=REPLACE"
  ConnectionStrings__OrderingDb: "Host=pg.example.com;Port=5432;Database=ordering;Username=REPLACE;Password=REPLACE"
  ConnectionStrings__InventoryDb: "Host=pg.example.com;Port=5432;Database=inventory;Username=REPLACE;Password=REPLACE"
  ConnectionStrings__PaymentsDb: "Host=pg.example.com;Port=5432;Database=payments;Username=REPLACE;Password=REPLACE"
  ConnectionStrings__FinanceDb: "Host=pg.example.com;Port=5432;Database=finance;Username=REPLACE;Password=REPLACE"
  ConnectionStrings__ShippingDb: "Host=pg.example.com;Port=5432;Database=shipping;Username=REPLACE;Password=REPLACE"
  # Managed Redis (AOF persistence on): basket + BFF sessions + DP key ring.
  ConnectionStrings__Redis: "redis.example.com:6379,password=REPLACE,ssl=True"
  # Object storage: EITHER a blobs connection string (Azure, selects the Azure
  # driver) OR S3 fields below (selects the S3 driver). Never both, never neither.
  ConnectionStrings__blobs: ""
  Storage__Endpoint: ""
  Storage__AccessKey: ""
  Storage__SecretKey: ""
  # Meilisearch with master key enforced (keyless mode is dev-only).
  ConnectionStrings__meilisearch: "http://meili.example.com:7700"
  Meilisearch__MasterKey: "REPLACE"
  # Keycloak (managed IdP or self-hosted) + prod realm built by
  # tools/keycloak/build-prod-realm.mjs with real client secrets.
  Keycloak__AuthServerUrl: "https://idp.example.com"
  Keycloak__Realm: "netcommerce"
  Auth__Audience: "netcommerce-api"
  Auth__ApiScope: "netcommerce.api"
  Auth__ClientId: "netcommerce-api"
  Auth__ClientSecret: "REPLACE"
  Auth__AdminElevated__ApiKey: "REPLACE-32-plus-char-secret"
  # Stripe LIVE keys (TestMode defaults false; test keys need explicit ack).
  Stripe__SecretKey: "REPLACE"
  Stripe__WebhookSecret: "REPLACE"
  # Outbound mail + alerting.
  Ordering__Email__SendGridApiKey: "REPLACE"
  Ordering__Email__FromEmail: "orders@example.com"
  Ordering__Alerting__PagerDutyRoutingKey: "REPLACE"
---
apiVersion: v1
kind: Secret
metadata:
  name: netcommerce-web
  namespace: netcommerce
type: Opaque
stringData:
  API_BASE_URL: "http://netcommerce-api:8080"
  KEYCLOAK_BASE_URL: "https://idp.example.com"
  KEYCLOAK_REALM: "netcommerce"
  KEYCLOAK_CLIENT_ID: "netcommerce-web"
  PUBLIC_ORIGIN: "https://shop.example.com"
  REDIS_URL: "rediss://:REPLACE@redis.example.com:6379"
  STORAGE_ORIGIN: "https://cdn.example.com"
  PUBLIC_API_ORIGIN: "https://api.example.com"
