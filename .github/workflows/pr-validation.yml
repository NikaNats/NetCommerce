name: PR Validation - Build & Test

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]

jobs:
  build-verify:
    name: Build & Test Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore --force-evaluate
      - name: Strict Compiler & Analyzer Validation (Zero-Error Policy)
        run: |
          # Roslyn enforces CA2000/CA2016/IL2026/IL3050 (+ CA1031 in Domain/Application)
          # as errors. Any resource-leak, missing-CancellationToken, or trimming breach
          # fails here. (Replaces the former grep-based CancellationToken guard.)
          # Perf/style findings (CA1848, IDE) stay visible as warnings, not gates.
          dotnet build NetCommerce.slnx \
            -c Release \
            --no-restore \
            /p:TreatWarningsAsErrors=true \
            /p:CodeAnalysisTreatWarningsAsErrors=true
      - name: Execute Architecture & Boundary Tests
        run: |
          dotnet test tests/NetCommerce.Architecture.Tests/NetCommerce.Architecture.Tests.csproj \
            -c Release \
            --no-build \
            --logger "console;verbosity=normal"
      # AutomatedLoadTest runs in the dedicated load-tests workflow (needs Docker + minutes);
      # keeping PR validation fast and hermetic.
      - run: dotnet test --no-build -c Release --filter "Category!=Integration&Category!=AutomatedLoadTest"
