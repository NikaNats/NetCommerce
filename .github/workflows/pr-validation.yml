name: PR Validation - CancellationToken Propagation

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]

jobs:
  cancellation-token-guard:
    name: Enforce CancellationToken Propagation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce CancellationToken Propagation in Handlers
        run: |
          echo "Scanning for async EF Core calls missing cancellationToken..."
          # Matches invocations of the reviewed EF Core async methods, then inspects
          # the call plus its continuation lines (invocations may span lines) for any
          # CancellationToken argument: cancellationToken, ct, cancellation (Wolverine),
          # or CancellationToken.None.
          # Excludes src/Api/Internal/Generated: machine-generated Wolverine handlers
          # receive Wolverine's own token and are verified by `codegen test` + arch tests.
          VIOLATIONS=$(grep -rnE "await\s+.*\.(ToListAsync|FirstOrDefaultAsync|SingleOrDefaultAsync|SaveChangesAsync|AnyAsync|CountAsync|ExecuteSqlRawAsync)\(" src --include="*.cs" \
            | grep -v "src/Api/Internal/Generated/" \
            | grep -v "CancelTest" \
            | while IFS=: read -r file line _; do
                if ! sed -n "${line},$((line + 6))p" "$file" \
                  | tr '\n' ' ' \
                  | grep -qE "\b(cancellationToken|ct|cancellation|CancellationToken\.None)\b"; then
                  echo "${file}:${line}";
                fi
              done || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ ARCHITECTURE VIOLATION: Missing CancellationToken in async EF Core calls."
            echo "Affected invocations must pass a CancellationToken to allow graceful K8s SIGTERM shutdown."
            echo ""
            echo "$VIOLATIONS"
            echo ""
            echo "Fix: Add CancellationToken cancellationToken as last param and pass it to EF Core:"
            echo "  var x = await db.Set.FirstOrDefaultAsync(e => e.Id == id, cancellationToken);"
            exit 1
          fi
          echo "✅ All async EF Core calls propagate CancellationToken."

  build-verify:
    name: Build & Test Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore --force-evaluate
      - run: dotnet build -c Release --no-restore
      - run: dotnet test --no-build -c Release --filter "Category!=Integration"
