name: Native AOT & Production Verification

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  IMAGE_NAME: 'netcommerce-api-aot:${{ github.sha }}'

jobs:
  static-checks-and-trim-boundaries:
    name: Verify AOT Trimming Boundaries & Codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Dependencies
        run: dotnet restore NetCommerce.slnx --locked-mode

      - name: Build Architecture & Unit Test Projects
        run: dotnet build tests/NetCommerce.Architecture.Tests/NetCommerce.Architecture.Tests.csproj -c Release --no-restore

      - name: Execute Architecture & Serialization Trim Boundary Tests
        run: |
          dotnet test tests/NetCommerce.Architecture.Tests/NetCommerce.Architecture.Tests.csproj \
            -c Release \
            --no-build \
            --logger "console;verbosity=normal"

  compile-native-container:
    name: Compile Native AOT Container
    runs-on: ubuntu-latest
    needs: [static-checks-and-trim-boundaries]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker Layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Native AOT Container (Clang + ILC Linker)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/Api/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move Cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache || true

      - name: Binary Anatomy Validation (Security & Chiseled Constraints)
        run: |
          echo "=== 1. Checking Image Size ==="
          RAW_SIZE=$(docker image inspect ${{ env.IMAGE_NAME }} --format='{{.Size}}')
          SIZE_MB=$((RAW_SIZE / 1024 / 1024))
          echo "Container size: ${SIZE_MB} MB"

          # Size ceiling (must stay within hardened boundaries, allowing for ICU libs)
          if [ $SIZE_MB -gt 500 ]; then
            echo "ERROR: Image size (${SIZE_MB}MB) exceeds the 500MB production budget!"
            exit 1
          fi

          echo "=== 2. Verifying Shell Absence (Chiseled Hardening) ==="
          if docker run --rm ${{ env.IMAGE_NAME }} /bin/sh 2>&1 | grep -qE "not found|no such file"; then
            echo "PASS: Zero interactive shell access verified."
          else
            echo "FAIL: Container contains interactive shell (/bin/sh)."
            exit 1
          fi

          echo "=== 3. Verifying Non-Root UID execution ==="
          USER_ID=$(docker inspect ${{ env.IMAGE_NAME }} --format='{{.Config.User}}')
          echo "Configured Container User: $USER_ID"
          if [ "$USER_ID" = "0" ] || [ "$USER_ID" = "root" ]; then
            echo "FAIL: Container configured to run as root!"
            exit 1
          fi

      - name: Save Docker Image Artifact for Smoke Test
        run: |
          docker save ${{ env.IMAGE_NAME }} -o /tmp/netcommerce-aot.tar

      - name: Upload Container Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-aot-image
          path: /tmp/netcommerce-aot.tar
          retention-days: 1

  database-migration-and-drift-verification:
    name: Multi-Schema Migration & Blue-Green Compatibility Drills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Dependencies
        run: dotnet restore NetCommerce.slnx --locked-mode

      - name: Execute Migration Idempotency, Expand/Contract & Envelope Drift Tests
        run: |
          # Integration tests self-provision PostgreSQL + Redis via Testcontainers
          # (Docker is pre-installed on ubuntu-latest runners).
          dotnet test tests/NetCommerce.Integration.Tests/NetCommerce.Integration.Tests.csproj \
            -c Release \
            --filter "Category=DatabaseMigrations|Category=BlueGreenCompatibility|Category=WolverineDrift" \
            --logger "console;verbosity=normal"

  native-runtime-smoke-test:
    name: Execute Native Binary Runtime Smoke Suite
    runs-on: ubuntu-latest
    needs: [compile-native-container]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Password123!
          POSTGRES_DB: netcommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      meilisearch:
        image: getmeili/meilisearch:v1.12
        env:
          MEILI_NO_ANALYTICS: "true"
          # No MEILI_MASTER_KEY: runs in no-security mode so the Aspire client's
          # health check can reach it with a plain endpoint URL.
        ports:
          - 7700:7700
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:7700/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Shared by the JIT migration runner and the native container (host networking)
      CONNECTIONSTRINGS__CATALOGDB: Host=127.0.0.1;Port=5432;Database=netcommerce;Username=postgres;Password=Password123!;SearchPath=catalog
      CONNECTIONSTRINGS__ORDERINGDB: Host=127.0.0.1;Port=5432;Database=netcommerce;Username=postgres;Password=Password123!;SearchPath=ordering
      CONNECTIONSTRINGS__INVENTORYDB: Host=127.0.0.1;Port=5432;Database=netcommerce;Username=postgres;Password=Password123!;SearchPath=inventory
      CONNECTIONSTRINGS__PAYMENTSDB: Host=127.0.0.1;Port=5432;Database=netcommerce;Username=postgres;Password=Password123!;SearchPath=payments
      CONNECTIONSTRINGS__FINANCEDB: Host=127.0.0.1;Port=5432;Database=netcommerce;Username=postgres;Password=Password123!;SearchPath=finance
      CONNECTIONSTRINGS__SHIPPINGDB: Host=127.0.0.1;Port=5432;Database=netcommerce;Username=postgres;Password=Password123!;SearchPath=shipping
      CONNECTIONSTRINGS__POSTGRES: Host=127.0.0.1;Port=5432;Database=netcommerce;Username=postgres;Password=Password123!
      CONNECTIONSTRINGS__REDIS: 127.0.0.1:6379
      CONNECTIONSTRINGS__MEILISEARCH: http://127.0.0.1:7700
      # Full Azurite dev-store connection string (Azure.Storage.Blobs does not
      # understand the legacy 'UseDevelopmentStorage=true' shorthand).
      CONNECTIONSTRINGS__BLOBS: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK (For Database Migration Phase)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download Container Artifact
        uses: actions/download-artifact@v4
        with:
          name: native-aot-image
          path: /tmp

      - name: Load Docker Image
        run: docker load -i /tmp/netcommerce-aot.tar

      - name: Start Azurite (Blob Storage Emulator)
        run: |
          # The services block cannot override the container command, and Azurite
          # must bind 0.0.0.0 to be reachable through the port mapping.
          docker run -d --name azurite -p 10000:10000 \
            mcr.microsoft.com/azure-storage-azurite:latest \
            azurite-blob --blobHost 0.0.0.0 --blobPort 10000
          for i in {1..20}; do
            if curl -s -o /dev/null http://127.0.0.1:10000/devstoreaccount1; then
              echo "Azurite is up."
              break
            fi
            sleep 1
          done

      - name: Apply EF Core Schema Migrations (JIT Migration Runner)
        run: |
          echo "Applying all 6 module schemas to PostgreSQL..."
          # Debug config = pure JIT (PublishAot is gated to Release in the csproj), so EF's
          # dynamic model services stay available for the migration runner.
          dotnet run --project src/Api/NetCommerce.Api.csproj -c Debug --no-launch-profile -- --migrate-only

      - name: Start Native AOT Container
        run: |
          docker run -d \
            --name netcommerce-api-prod \
            --network host \
            -e "ConnectionStrings__CatalogDb=$CONNECTIONSTRINGS__CATALOGDB" \
            -e "ConnectionStrings__OrderingDb=$CONNECTIONSTRINGS__ORDERINGDB" \
            -e "ConnectionStrings__InventoryDb=$CONNECTIONSTRINGS__INVENTORYDB" \
            -e "ConnectionStrings__PaymentsDb=$CONNECTIONSTRINGS__PAYMENTSDB" \
            -e "ConnectionStrings__FinanceDb=$CONNECTIONSTRINGS__FINANCEDB" \
            -e "ConnectionStrings__ShippingDb=$CONNECTIONSTRINGS__SHIPPINGDB" \
            -e "ConnectionStrings__postgres=$CONNECTIONSTRINGS__POSTGRES" \
            -e "ConnectionStrings__redis=$CONNECTIONSTRINGS__REDIS" \
            -e "ConnectionStrings__meilisearch=$CONNECTIONSTRINGS__MEILISEARCH" \
            -e "ConnectionStrings__blobs=$CONNECTIONSTRINGS__BLOBS" \
            -e "Auth__AdminElevated__ApiKey=production-strict-key-minimum-32-chars-long!" \
            -e "Auth__AdminElevated__SecurityMode=DevelopmentOnly" \
            -e "ASPNETCORE_ENVIRONMENT=Production" \
            -e "ASPNETCORE_URLS=http://+:8080" \
            ${{ env.IMAGE_NAME }}

      - name: Verification Checkpoint 1 — Startup Latency & Zero Trim Faults
        run: |
          echo "Waiting for Native AOT application startup..."
          SUCCESS=0
          for i in {1..30}; do
            LOGS=$(docker logs netcommerce-api-prod 2>&1 || true)
            if echo "$LOGS" | grep -q "Now listening on"; then
              echo "PASS: Application started successfully."
              SUCCESS=1
              break
            fi

            # Check for immediate Native AOT crashes
            if echo "$LOGS" | grep -qE "MissingMethodException|TypeLoadException|JsonException|PlatformNotSupportedException"; then
              echo "FATAL CRASH DETECTED IN NATIVE AOT LOGS:"
              echo "$LOGS"
              exit 1
            fi
            sleep 0.5
          done

          if [ $SUCCESS -eq 0 ]; then
            echo "TIMEOUT: Native AOT container did not start listening within 15 seconds."
            docker logs netcommerce-api-prod
            exit 1
          fi

      - name: Verification Checkpoint 2 — K8s Readiness & Liveness Probes
        run: |
          echo "Executing HTTP Readiness Probe..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/health/ready)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Readiness probe failed with status $HTTP_CODE"
            curl -v http://127.0.0.1:8080/health/ready
            docker logs netcommerce-api-prod
            exit 1
          fi

          echo "Executing HTTP Liveness Probe..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/health/alive)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Liveness probe failed with status $HTTP_CODE"
            exit 1
          fi

      - name: Verification Checkpoint 3 — Read Flow (Catalog Serialization & EF Core Native Read)
        run: |
          echo "Querying /api/v1/products over Native HTTP Pipeline..."
          RESPONSE=$(curl -s -w "\n%{http_code}" http://127.0.0.1:8080/api/v1/products)
          STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$STATUS" != "200" ]; then
            echo "Catalog read failed with HTTP $STATUS. Response:"
            echo "$BODY"
            docker logs netcommerce-api-prod
            exit 1
          fi

          echo "Validating JSON response structure without reflection faults..."
          echo "$BODY" | grep -q "pagination" || echo "$BODY" | grep -q "items" || {
            echo "Malformed or non-JSON output returned: $BODY"
            exit 1
          }

      - name: Verification Checkpoint 4 — Mutative Flow (JSON Deserialization & Handler Execution)
        run: |
          # ── 4a. Auth-protected write path ──────────────────────────────────────
          # POST /api/v1/orders requires the "CustomerOnly" policy (Keycloak JWT),
          # which the smoke environment intentionally does not provide. An
          # unauthenticated request MUST be rejected with exactly 401: that proves
          # routing, rate limiting, and the authentication middleware all execute
          # correctly in the native binary. A 500 here indicates an AOT trim crash.
          ORDER_PAYLOAD=$(cat <<EOF
          {
            "customerId": "3fa85f64-5717-4562-b3fc-2c963f66afa6",
            "customerEmail": "aot.smoke@netcommerce.internal",
            "customerName": "AOT Verification Agent",
            "items": [],
            "shippingAddress": {
              "street": "77 Cyber Ave",
              "city": "Tbilisi",
              "state": "GA",
              "postalCode": "0108",
              "country": "GE",
              "recipientName": "AOT Agent",
              "phoneNumber": "+995555000000"
            },
            "billingAddress": {
              "street": "77 Cyber Ave",
              "city": "Tbilisi",
              "state": "GA",
              "postalCode": "0108",
              "country": "GE"
            },
            "paymentMethod": "CreditCard",
            "idempotencyKey": "$(uuidgen)"
          }
          EOF
          )

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://127.0.0.1:8080/api/v1/orders \
            -H "Content-Type: application/json" \
            -d "$ORDER_PAYLOAD")

          echo "Order creation (unauthenticated) status: $STATUS"
          if [ "$STATUS" = "500" ]; then
            echo "CRITICAL: Mutative route triggered a 500 Internal Error under Native AOT!"
            docker logs netcommerce-api-prod
            exit 1
          fi
          if [ "$STATUS" != "401" ]; then
            echo "FAIL: Expected 401 Unauthorized (auth middleware rejects before handler); got $STATUS."
            docker logs netcommerce-api-prod
            exit 1
          fi
          echo "PASS: Auth middleware rejects unauthenticated writes with 401 (no trim crash)."

          # ── 4b. Anonymous mutative flow: real deserialization + handler execution ──
          # POST /api/v1/auth/token is [AllowAnonymous]. An unsupported grant_type is
          # rejected AFTER the JSON body is deserialized via ApiJsonContext (source-gen)
          # and returns an AuthErrorResponse serialized by the source generator - a
          # deterministic write-path exercise that needs no Keycloak. Anything other
          # than 400 means the native pipeline failed (500 = trim crash, 404 = routing).
          STATUS=$(curl -s -o /tmp/auth-response.json -w "%{http_code}" \
            -X POST http://127.0.0.1:8080/api/v1/auth/token \
            -H "Content-Type: application/json" \
            -d '{"grant_type":"password","username":"smoke","password":"test"}')

          echo "Auth token exchange (ROPC rejection) status: $STATUS"
          echo "Response body: $(cat /tmp/auth-response.json)"

          if [ "$STATUS" != "400" ]; then
            echo "FAIL: Expected 400 (source-gen deserialized request + serialized AuthErrorResponse); got $STATUS."
            docker logs netcommerce-api-prod
            exit 1
          fi

          grep -q "unsupported_grant_type" /tmp/auth-response.json || {
            echo "FAIL: Response is not a well-formed AuthErrorResponse."
            exit 1
          }
          echo "PASS: Anonymous mutative flow deserialized, executed handler, and serialized response."

      - name: Print Diagnostics on Failure
        if: failure()
        run: |
          echo "=== DOCKER LOGS ==="
          docker logs netcommerce-api-prod
          echo "=== CONTAINER STATE ==="
          docker inspect netcommerce-api-prod
